      <stop offset="0" stop-color="#263c52" />
      <stop offset="1" stop-color="#0b1117" />
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6d0ee" />
      <stop offset="1" stop-color="#b9f0d6" />
